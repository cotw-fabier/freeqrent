# cargo deny check — licenses, advisories, bans, sources.
# The core's zero-dependency rule is enforced separately by
# scripts/check-core-deps.sh (cargo-deny can't scope a ban to one crate).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# chrono is unmaintained (no fix exists). It reaches us only through rxing
# (ZXing, in freeqrent-verify: the CLI's --verify and the scan tests), not
# the core or any binding, and rxing 0.9.4 still needs it. Drop this when
# rxing moves off chrono.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; only via rxing in freeqrent-verify, no alternative yet" },
]

[licenses]
version = 2
# Permissive licenses only. Later crates (image, verify, bindings) will need
# some of these; unused ones are fine.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "ISC"]
unused-allowed-license = "allow"
confidence-threshold = 0.9

# pyo3-build-config's platform table (the Python binding's build only).
[[licenses.exceptions]]
crate = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
