[package]
name = "freeqrent-ffi"
description = "freeQRent's C ABI: Style documents in, SVG out, for Dart, Go, Swift and any C host"
keywords = ["qr", "qrcode", "svg", "ffi"]
categories = ["multimedia::images", "external-ffi-bindings"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Released with the bindings (M9), not with the 1.0 core.
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
freeqrent-doc = { path = "../freeqrent-doc", version = "1.1.0" }

# Not the workspace lints: this is the one crate that needs unsafe, to read
# the caller's pointers.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[dev-dependencies]
freeqrent = { path = "../freeqrent" }
