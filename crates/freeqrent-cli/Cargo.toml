[package]
name = "freeqrent-cli"
description = "Command-line front end and preview tool for freeQRent"
keywords = ["qr", "qrcode", "svg", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "freeqrent"
path = "src/main.rs"

[features]
default = ["verify"]
# `--verify` and verified galleries (pulls in resvg, rqrr and rxing).
verify = ["dep:freeqrent-verify"]

[dependencies]
freeqrent = { path = "../freeqrent", version = "1.0.0" }
freeqrent-image = { path = "../freeqrent-image", version = "1.0.0" }
freeqrent-verify = { path = "../freeqrent-verify", version = "1.0.0", optional = true }
lexopt = "0.3.2"

[lints]
workspace = true

[dev-dependencies]
png = "0.18.1"
# The surface test runs every CLI equivalence through the Style document too.
freeqrent-doc = { path = "../freeqrent-doc" }
