[package]
name = "freeqrent-image"
description = "Decodes PNG and JPEG into freeQRent's Rgba8Image, for palette extraction"
keywords = ["qr", "png", "jpeg", "palette"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["png", "jpeg"]
png = ["dep:zune-png"]
jpeg = ["dep:zune-jpeg"]

[dependencies]
freeqrent = { path = "../freeqrent", version = "0.1.0", default-features = false }
zune-core = { version = "0.5.3", features = ["std"] }
zune-png = { version = "0.5.2", optional = true }
zune-jpeg = { version = "0.5.15", optional = true }

[dev-dependencies]
freeqrent = { path = "../freeqrent", features = ["palette-extract"] }
png = "0.18.1"
jpeg-encoder = "0.7.1"

[lints]
workspace = true
