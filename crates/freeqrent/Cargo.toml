[package]
name = "freeqrent"
description = "Styled and animated SVG QR codes, with zero dependencies"
keywords = ["qr", "qrcode", "svg", "no_std"]
categories = ["encoding", "multimedia::images", "no-std"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std", "animate", "palette-extract", "halftone"]
# Intro animations as CSS keyframes, `AnimationPlan` and frame renders.
animate = []
# Codes built from a picture: module steering and halftone (SPEC §7.7).
halftone = []
# Palettes derived from pixels (`Palette::from_image`) and CSS/HTML text.
palette-extract = []
# `std::error::Error` impls and the `std::io::Write` sink (`Style::render_io`).
std = []
# Kanji mode for JIS X 0208 text (adds a ~27 KB table).
kanji = []

[dependencies]

[lints]
workspace = true

[dev-dependencies]
qrcodegen = "1.8"
rqrr = "0.11.0"
insta = "1.49.0"
