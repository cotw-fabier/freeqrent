[package]
name = "freeqrent-verify"
description = "Rasterizes freeQRent SVGs and decodes them to prove they scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
resvg = { version = "0.49.0", default-features = false }
rqrr = "0.11.0"
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }

[dev-dependencies]
freeqrent = { path = "../freeqrent" }

[lints]
workspace = true
