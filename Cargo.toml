[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/cotw-fabier/freeqrent"
authors = ["Dan Kolansky"]
homepage = "https://github.com/cotw-fabier/freeqrent"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Round-trip tests encode thousands of symbols; debug builds make them slow.
[profile.test]
opt-level = 2
