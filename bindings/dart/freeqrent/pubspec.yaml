name: freeqrent
description: >-
  Styled and animated SVG QR codes that always scan. Dart bindings to the
  freeQRent Rust core over dart:ffi, built with Native Assets.
version: 1.1.0
homepage: https://github.com/cotw-fabier/freeQRent
repository: https://github.com/cotw-fabier/freeQRent
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  ffi: 2.2.0
  hooks: 2.2.0
  native_toolchain_rust: 1.0.7

dev_dependencies:
  crypto: 3.0.7
  test: 1.31.0
