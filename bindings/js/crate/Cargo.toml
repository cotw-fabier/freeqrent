[package]
name = "freeqrent-wasm"
description = "freeQRent's WebAssembly build for npm: wasm-bindgen exports over freeqrent-doc"
version = "1.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/cotw-fabier/freeQRent"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The binding feature set (SPEC §10.3) comes from freeqrent-doc's own
# dependency on the core: std, animate, palette-extract, halftone; kanji off.
freeqrent-doc = { path = "../../../crates/freeqrent-doc" }
wasm-bindgen = { version = "=0.2.129", default-features = false, features = ["std"] }

# Size-tuned like scripts/wasm-size.sh.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Its own workspace: the binding builds apart from the core's.
[workspace]
